<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2a2430">
<title>ブライダル進行（見本）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* スマホ用の見本アプリ。1画面＝1つの仕事。下のタブで4画面を切り替え、細かい操作は下から出るシートで行う */
:root{
  --bg:#f6f3f5; --card:#ffffff; --ink:#2a2430; --muted:#766d78; --line:#e9e2e7; --sunk:#f0ebee;
  --accent:#8a3a5c; --accent-soft:#f5e8ee; --bar:#2a2430; --on-bar:#ffffff;
  --safe:#2d6db5; --safe-soft:#e3edf9; --mid:#a8740a; --mid-soft:#fbf0d6; --risk:#c2362b; --risk-soft:#fbe4e1;
  --none:#3b3440; --none-soft:#e2dde3; --done:#3f7a5e; --done-soft:#e3f0e8;
  --k-mtg:#7a5aa6; --k-dress:#c2577f; --k-beauty:#1f8a80; --k-photo:#5b6b2b; --k-day:#8a5f3c; --k-other:#6c6370;
  --shadow:0 1px 2px rgba(42,36,48,.06),0 4px 14px rgba(42,36,48,.06);
  --f:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141215; --card:#211d23; --ink:#ede7ec; --muted:#a8a0aa; --line:#352f38; --sunk:#2a252d;
  --accent:#e598b8; --accent-soft:#3a2430; --bar:#211d23; --on-bar:#ede7ec;
  --safe:#7fb2ee; --safe-soft:#1d2b3d; --mid:#e8bd5c; --mid-soft:#382c14; --risk:#f28b80; --risk-soft:#3d1f1c;
  --none:#d9d2db; --none-soft:#3a343c; --done:#8fcfae; --done-soft:#1f3229;
  --k-mtg:#b9a0e6; --k-dress:#f09ab8; --k-beauty:#7fd3c9; --k-photo:#c3d17f; --k-day:#e0b48d; --k-other:#b3aab4;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:520px){body{background:var(--sunk)}.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* 上のバー */
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--on-bar);padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px}
.top small{display:block;font-size:12px;opacity:.7}
.top b{font-size:17px}
.top .days{float:right;text-align:right;font-size:12px;opacity:.85;line-height:1.35;margin-top:2px}
.top .days strong{display:block;font-size:20px}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
.view{display:flex;flex-direction:column;gap:14px}
h2{margin:4px 2px 0;font-size:20px;line-height:1.35}
.sub{margin:-8px 2px 0;font-size:13.5px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}

/* 状態 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.safe{color:var(--safe);background:var(--safe-soft)} .st.mid{color:var(--mid);background:var(--mid-soft)} .st.risk{color:var(--risk);background:var(--risk-soft)}
.st.none{color:var(--none);background:var(--none-soft)} .st.done{color:var(--done);background:var(--done-soft)}
.c-safe{--c:var(--safe);--cs:var(--safe-soft)} .c-mid{--c:var(--mid);--cs:var(--mid-soft)} .c-risk{--c:var(--risk);--cs:var(--risk-soft)} .c-none{--c:var(--none);--cs:var(--none-soft)} .c-done{--c:var(--done);--cs:var(--done-soft)}

/* 横スクロールのチップ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.counts{display:flex;gap:8px;flex-wrap:wrap}

/* やること */
.todo{display:flex;flex-direction:column;gap:12px}
.task{position:relative;overflow:hidden;padding:16px 16px 16px 20px;display:flex;flex-direction:column;gap:10px}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.task .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task .me{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.task h3{margin:0;font-size:18px;line-height:1.35}
.task .meta{font-size:13.5px;color:var(--muted)}
.task .big{display:flex;gap:18px}
.task .big div{display:flex;flex-direction:column;line-height:1.2}
.task .big strong{font-size:26px;color:var(--c);font-variant-numeric:tabular-nums}
.task .big span{font-size:12px;color:var(--muted)}
.task .why{font-size:13.5px;background:var(--cs);border-radius:10px;padding:8px 11px}
.go{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--c);color:var(--bg)}
.c-safe .go,.c-mid .go{background:var(--ink);color:var(--bg)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14.5px}
.done-list{padding:6px 16px}
.done-list summary{padding:10px 0;font-weight:700;font-size:14.5px;cursor:pointer}
.done-list div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.done-list div span{color:var(--done);font-weight:700;white-space:nowrap}

/* 工程 */
.step{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.step .h{display:flex;align-items:center;gap:10px}
.step .h b{flex:1;min-width:0;font-size:16px;line-height:1.35}
.kd{width:12px;height:12px;border-radius:4px;background:var(--k);flex:none}
.k-mtg{--k:var(--k-mtg)} .k-dress{--k:var(--k-dress)} .k-beauty{--k:var(--k-beauty)} .k-photo{--k:var(--k-photo)} .k-day{--k:var(--k-day)} .k-other{--k:var(--k-other)}
.more{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:5px 12px;font-size:13.5px;font-weight:700;color:var(--muted)}
.dl-line{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.dl-line strong{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.warn{font-size:13px;color:var(--risk);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--sunk) 0 var(--p),var(--cs) var(--p) 100%);border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--sunk);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--c);border:4px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--c);border:4px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.add{border:2px dashed var(--line);background:transparent;border-radius:18px;padding:16px;font-weight:700;font-size:16px;color:var(--accent)}

/* NG日 */
.ngcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.ngcard h3{margin:0;font-size:15.5px}
.ngcard h3 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:16px}
.week button[aria-pressed="true"]{background:var(--risk);border-color:var(--risk);color:var(--bg)}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead b{font-size:16px}
.nav{width:44px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.nav:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-variant-numeric:tabular-nums}
.cal .wd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:700}
.cal button,.cal span{height:44px;border-radius:11px;display:grid;place-items:center;font-size:15px;padding:0;border:1.5px solid transparent;background:var(--bg)}
.cal button{border-color:var(--line)}
.cal button[aria-pressed="true"]{background:var(--risk);border-color:var(--risk);color:var(--bg);font-weight:700}
.cal span.off{background:transparent;color:var(--muted);opacity:.4}
.cal span.wk{background:var(--risk-soft);color:var(--risk);opacity:.85}
.cal span.wed{background:var(--accent);color:var(--bg);font-weight:700;font-size:13px}
.cal span.blank{background:transparent}
.impact{display:flex;flex-direction:column;gap:8px}
.impact div{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.impact div b{flex:1;min-width:0}
.impact div span.n{font-size:12.5px;color:var(--muted);white-space:nowrap}
.reset{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:6px;align-self:center}

/* 全体 */
.ov{padding:12px 14px 6px}
.axis{position:relative;height:20px;font-size:11px;color:var(--muted);font-weight:700}
.axis span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%)}
.axis span.l{transform:none} .axis span.r{transform:translateX(-100%);color:var(--accent)}
.orow{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;gap:6px}
.orow .t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.orow .t span.r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.track{position:relative;height:16px;border-radius:8px;background:var(--sunk)}
.track .w{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--cs);border:1.5px solid var(--c)}
.track .p{position:absolute;top:-3px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--c);border:3px solid var(--card)}
.track .wait{position:absolute;top:6px;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.track .today{position:absolute;left:0;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.4}

/* 下のタブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:480px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.tabs a svg{width:26px;height:26px}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--risk);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(20,14,20,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.sheet h3{margin:0;font-size:19px;line-height:1.35}
.sheet .x{position:absolute;right:12px;top:10px;width:40px;height:40px;border:0;background:var(--sunk);border-radius:50%;font-size:18px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:-6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;text-align:left}
.opt small{font-size:12.5px;color:var(--muted);font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.who button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-weight:700;font-size:15px}
.who button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0;font-size:13.5px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sel{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.stepper strong{min-width:110px;text-align:center;font-size:16px}
.primary{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:var(--accent);color:#fff}
.primary:disabled{opacity:.4}
.danger{border:0;background:transparent;color:var(--risk);font-weight:700;padding:8px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.txt{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}

/* トースト */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;width:min(440px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="days">挙式まで<strong id="left-days">68日</strong></span>
    <small>見本 · 中身はすべて例です</small>
    <b>◯◯様　1/23（土）挙式</b>
  </header>

  <main>
    <!-- やること -->
    <section class="view" id="v-home">
      <h2>今やること</h2>
      <div class="chips" id="me" role="group" aria-label="見ている人"></div>
      <div class="counts" id="counts"></div>
      <div class="todo" id="todo"></div>
      <details class="card done-list" id="done"></details>
    </section>

    <!-- 工程 -->
    <section class="view" id="v-steps" hidden>
      <h2>工程の型</h2>
      <p class="sub">つまみを動かすと「挙式の何日前まで」が変わり、色もその場で変わります。</p>
      <div class="todo" id="steps"></div>
      <button type="button" class="add" id="add-step">＋ 工程を追加</button>
    </section>

    <!-- NG日 -->
    <section class="view" id="v-ng" hidden>
      <h2>NG日の登録</h2>
      <p class="sub">「絶対に無理な日」だけ。理由は書かなくて大丈夫です。</p>
      <div class="chips" id="ng-who" role="group" aria-label="スタッフ"></div>
      <div class="card ngcard">
        <h3>いつものNG<small>本業の曜日など</small></h3>
        <div class="week" id="ng-week" role="group" aria-label="いつものNGの曜日"></div>
      </div>
      <div class="card ngcard">
        <h3>この日だけのNG<small>日付をタップ</small></h3>
        <div class="calhead"><button type="button" class="nav" id="ng-prev" aria-label="前の月">‹</button><b id="ng-month"></b><button type="button" class="nav" id="ng-next" aria-label="次の月">›</button></div>
        <div class="cal" id="ng-cal"></div>
      </div>
      <div class="card ngcard">
        <h3 id="ng-imp-title">この人が必要な工程</h3>
        <div class="impact" id="ng-imp"></div>
      </div>
      <button type="button" class="reset" id="ng-reset">見本の状態に戻す</button>
    </section>

    <!-- 全体 -->
    <section class="view" id="v-all" hidden>
      <h2>挙式までの全体</h2>
      <p class="sub">棒は「始められる日〜締切」。丸は決まった日・仮押さえの日です。</p>
      <div class="card ov" id="ov"></div>
    </section>
  </main>

  <div class="tabs"><nav aria-label="画面の切り替え">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>やること<span class="badge" id="badge" hidden></span></a>
    <a href="#steps" data-tab="steps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M4 12h14M4 18h8"/><circle cx="17" cy="6" r="2"/><circle cx="20" cy="12" r="2"/><circle cx="15" cy="18" r="2"/></svg>工程</a>
    <a href="#ng" data-tab="ng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 14l4 4M14 14l-4 4"/></svg>NG日</a>
    <a href="#all" data-tab="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"/></svg>全体</a>
  </nav></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var DAY=86400000, TODAY=Date.UTC(2026,10,16), WED=Date.UTC(2027,0,23), SPAN=Math.round((WED-TODAY)/DAY), WD="日月火水木金土";
  function fmt(t){var x=new Date(t);return (x.getUTCMonth()+1)+"/"+x.getUTCDate()}
  function fmtw(t){return fmt(t)+"（"+WD[new Date(t).getUTCDay()]+"）"}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
  function wd(t){return new Date(t).getUTCDay()}
  function $(id){return document.getElementById(id)}

  // スタッフとNG日（見本の初期値）
  var STAFF=[{k:"lead",n:"責任者"},{k:"pl",n:"プランナー"},{k:"hm",n:"ヘアメイク"},{k:"cos",n:"衣装"},{k:"ph",n:"フォト"}], SN={};
  STAFF.forEach(function(s){SN[s.k]=s});
  var NG0={lead:{w:[],d:[[11,22],[12,6]]},pl:{w:[0,1,6],d:[]},hm:{w:[0,4,5,6],d:[]},cos:{w:[1,2,4,5],d:[]},ph:{w:[0,5,6],d:[]}}, NG={};
  function resetNG(){Object.keys(NG0).forEach(function(k){var w={},d={};NG0[k].w.forEach(function(x){w[x]=1});NG0[k].d.forEach(function(x){d[Date.UTC(x[0]>=11?2026:2027,x[0]-1,x[1])]=1});NG[k]={w:w,d:d}})}
  resetNG();
  function ok(k,t){var n=NG[k];return !n.w[wd(t)]&&!n.d[t]}

  // 工程（before=挙式の何日前まで、from=何日前から、after=前の工程、gap=その何日後から）

  function clone(p){return {id:p.id,cat:p.cat,name:p.name,need:p.need.slice(),dur:p.dur,before:p.before,after:p.after||"",gap:p.gap||0,fixed:p.fixed||null,from:p.after?null:p.before+21}}

  function byId(id){for(var i=0;i<tasks.length;i++)if(tasks[i].id===id)return tasks[i];return null}

  // 計算：締切までに必要な人が全員そろう日を数え、余裕を色にする
  var LABEL={safe:"余裕あり",mid:"早めに",risk:"急ぎ",none:"組めない",done:"決定"}, RANK={none:0,risk:1,mid:2,safe:3,done:4};
  function compute(){
    var res={},order=[],st={};
    function visit(t){if(st[t.id]===2)return;if(st[t.id]===1)return;st[t.id]=1;var p=t.after&&byId(t.after);if(p)visit(p);st[t.id]=2;order.push(t)}

  // 画面の状態

  // 色が変わったものを知らせる

    if(b.closest("#ng-who")){ngWho=b.dataset.k;renderNG();return}
    if(b.closest("#ng-week")){var before=snapshot(),w=+b.dataset.w,n=NG[ngWho];if(n.w[w])delete n.w[w];else n.w[w]=1;renderAllViews();var c=changes(before);if(c.length)toast(c.join("、"));return}
    if(b.closest("#ng-cal")){var bf=snapshot(),t=+b.dataset.t,m=NG[ngWho];if(m.d[t])delete m.d[t];else m.d[t]=1;renderAllViews();var c3=changes(bf);if(c3.length)toast(c3.join("、"));return}
    if(b.id==="ng-prev"||b.id==="ng-next"){var x=new Date(ngMonth);ngMonth=Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+(b.id==="ng-next"?1:-1),1);renderNG();return}
    if(b.id==="ng-reset"){resetNG();renderAllViews();toast("NG日を見本の状態に戻しました");return}
  });
  // 締切のつまみ：動かしている間はその行だけ更新し、離したら全体を更新
  var rangeBefore=null;
  document.querySelector("main").addEventListener("input",function(e){
    var id=e.target.dataset.range;if(!id)return;if(!rangeBefore)rangeBefore=snapshot();
    var t=byId(id),v=+e.target.value;t.before=120-v;if(!t.after&&t.from!=null&&t.from<t.before)t.from=t.before;
    var A=compute(),r=A.res[id],card=e.target.closest(".step");
    card.className="card step c-"+r.lv+" k-"+(KEY[t.cat]||"other");
    card.querySelector(".st").className="st "+r.lv;card.querySelector(".st").textContent=LABEL[r.lv];
    card.querySelector(".dl-line strong").textContent="挙式の"+t.before+"日前（"+fmt(r.dl)+"）";
    e.target.style.setProperty("--p",(v/120*100)+"%");
  });
  document.querySelector("main").addEventListener("change",function(e){
    if(!e.target.dataset.range)return;var b=rangeBefore||snapshot();rangeBefore=null;
    var y=window.scrollY;renderHome();renderNG();renderAll();renderSteps();window.scrollTo(0,y);
    var c=changes(b);if(c.length)toast(c.join("、"));
  });

  // タブ（#home / #steps / #ng / #all）
  var TABS=["home","steps","ng","all"];
  function route(){var h=location.hash.replace("#","");if(TABS.indexOf(h)<0)h="home";
    TABS.forEach(function(k){$("v-"+k).hidden=k!==h});
    [].forEach.call(document.querySelectorAll(".tabs a"),function(a){if(a.dataset.tab===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
    hideToast();closeSheet();window.scrollTo(0,0)}
  window.addEventListener("hashchange",route);

  $("left-days").textContent=SPAN+"日";
  renderAllViews();route();
})();
</script>
</body>
</html>
